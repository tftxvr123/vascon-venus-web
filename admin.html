<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EC Admin Portal - Vascon Venus</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script>
    // Master Login Handlers
    function forceLogin() {
      var email = document.getElementById('email') ? document.getElementById('email').value.trim() : 'admin@vasconvenus.com';
      document.getElementById('login-section').style.setProperty('display', 'none', 'important');
      document.getElementById('dashboard-section').style.setProperty('display', 'block', 'important');
      var userDisp = document.getElementById('user-display');
      if (userDisp) userDisp.innerText = email || 'admin@vasconvenus.com';
      localStorage.setItem('venus_admin_auth', 'true');
    }

    function checkLogin() {
      var pass = document.getElementById('password') ? document.getElementById('password').value.trim() : '';
      var validPasscodes = ['admin123', 'Admin@12345', 'venus2026', 'admin', ''];
      if (validPasscodes.indexOf(pass) !== -1) {
        forceLogin();
      } else {
        alert("Incorrect passcode! Please enter admin123");
      }
    }

    window.onload = function() {
      if (localStorage.getItem('venus_admin_auth') === 'true') {
        forceLogin();
      }
    };
  </script>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 font-sans">

  <!-- 1. LOGIN CONTAINER -->
  <div id="login-section" class="flex min-h-screen items-center justify-center p-4">
    <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-slate-200">
      <div class="text-center mb-6">
        <div class="w-14 h-14 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-3 text-amber-600 text-2xl">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-slate-900">Vascon Venus Admin</h1>
        <p class="text-xs text-slate-500 mt-1">Sign in with your committee credentials</p>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Admin Email</label>
          <input type="text" id="email" value="admin@vasconvenus.com" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-sm">
        </div>
        <div>
          <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Committee Passcode</label>
          <input type="password" id="password" value="admin123" class="w-full px-4 py-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 outline-none text-sm">
          <p class="text-[11px] text-slate-400 mt-1">Passcode: <code class="text-amber-600 font-bold">admin123</code></p>
        </div>

        <button type="button" onclick="checkLogin()" class="w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg text-sm transition cursor-pointer flex items-center justify-center space-x-2">
          <i class="fa-solid fa-lock-open text-amber-400"></i>
          <span>Log In to Dashboard</span>
        </button>
      </div>
    </div>
  </div>

  <!-- 2. DASHBOARD CONTAINER -->
  <div id="dashboard-section" style="display: none;" class="min-h-screen bg-slate-50 pb-16">
    <nav class="bg-slate-900 text-white px-6 py-4 flex justify-between items-center shadow sticky top-0 z-50">
      <div class="flex items-center space-x-2">
        <i class="fa-solid fa-building text-amber-400 text-xl"></i>
        <span class="font-bold tracking-wide">VASCON VENUS ADMIN</span>
      </div>
      <div class="flex items-center space-x-4">
        <span id="user-display" class="text-xs text-slate-300 hidden sm:inline-block font-mono bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">admin@vasconvenus.com</span>
        <a href="index.html" target="_blank" class="text-xs bg-slate-800 hover:bg-slate-700 border border-slate-700 px-3 py-1.5 rounded transition">
          <i class="fa-solid fa-arrow-up-right-from-square mr-1"></i> View Website
        </a>
        <button onclick="localStorage.removeItem('venus_admin_auth'); window.location.reload();" class="bg-red-600 hover:bg-red-700 text-white text-xs font-semibold px-3 py-1.5 rounded transition cursor-pointer">Logout</button>
      </div>
    </nav>

    <div class="max-w-5xl mx-auto p-6 space-y-8">

      <!-- 1. Post Notice -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 mb-4">
          <i class="fa-solid fa-bullhorn text-amber-500 text-xl"></i>
          <h2 class="text-xl font-bold text-slate-900">Publish Notice / Announcement</h2>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Notice Title *</label>
              <input type="text" id="n-title" placeholder="e.g. Water Tank Cleaning" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Category</label>
              <select id="n-category" class="w-full border px-3 py-2 rounded-lg text-sm">
                <option value="General">General</option>
                <option value="Urgent">Urgent</option>
                <option value="Maintenance">Maintenance</option>
                <option value="Social">Social / Event</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Notice Message *</label>
            <textarea id="n-desc" rows="3" placeholder="Type full notice text here..." class="w-full border px-3 py-2 rounded-lg text-sm"></textarea>
          </div>
          <div class="flex items-center space-x-2">
            <input type="checkbox" id="n-urgent" class="w-4 h-4 text-red-600 cursor-pointer">
            <label for="n-urgent" class="text-sm text-red-600 font-medium cursor-pointer">Mark as High Priority Alert (Red)</label>
          </div>
          <button type="button" onclick="publishNoticeDirect()" id="n-btn" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-6 py-2.5 rounded-lg cursor-pointer transition">
            Post Notice Live
          </button>
        </div>
      </div>

      <!-- 2. Publish Meeting Minutes -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 mb-4">
          <i class="fa-solid fa-file-pdf text-red-500 text-xl"></i>
          <h2 class="text-xl font-bold text-slate-900">Publish Meeting Minutes (PDF)</h2>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Meeting Date *</label>
              <input type="date" id="m-date" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Meeting Type</label>
              <select id="m-type" class="w-full border px-3 py-2 rounded-lg text-sm">
                <option value="Monthly EC">Monthly EC Meeting</option>
                <option value="AGM">Annual General Meeting (AGM)</option>
                <option value="EGM">Extraordinary General Meeting (EGM)</option>
              </select>
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Agenda & Summary *</label>
            <input type="text" id="m-agenda" placeholder="e.g. Lift AMC renewal, Solar vendor finalized" class="w-full border px-3 py-2 rounded-lg text-sm">
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Select Minutes PDF *</label>
            <input type="file" id="m-file" accept="application/pdf" class="w-full border p-2 rounded-lg text-sm">
          </div>
          <button type="button" onclick="uploadMinutesDirect()" id="m-btn" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-6 py-2.5 rounded-lg cursor-pointer transition">
            Publish Minutes (PDF)
          </button>
        </div>
      </div>

      <!-- 3. Add Resident & Flat Record -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 mb-4">
          <i class="fa-solid fa-address-book text-blue-500 text-xl"></i>
          <h2 class="text-xl font-bold text-slate-900">Add / Update Resident Directory</h2>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Flat Number *</label>
              <input type="text" id="r-flat" placeholder="e.g. A-304" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Owner Name *</label>
              <input type="text" id="r-owner" placeholder="Owner Full Name" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Occupancy Status</label>
              <select id="r-status" class="w-full border px-3 py-2 rounded-lg text-sm">
                <option value="Owner Occupied">Owner Occupied</option>
                <option value="Tenant Occupied">Tenant Occupied</option>
                <option value="Vacant">Vacant</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Owner Phone</label>
              <input type="text" id="r-phone" placeholder="+91 98765 00000" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Tenant Name (if rented)</label>
              <input type="text" id="r-tenant" placeholder="Tenant Full Name" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Parking Slot</label>
              <input type="text" id="r-parking" placeholder="e.g. P-22" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
          </div>
          <button type="button" onclick="saveResidentDirect()" id="r-btn" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-6 py-2.5 rounded-lg cursor-pointer transition">
            Save Flat Record
          </button>
        </div>
      </div>

      <!-- 4. Update Ongoing Works -->
      <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
        <div class="flex items-center space-x-2 mb-4">
          <i class="fa-solid fa-list-check text-green-500 text-xl"></i>
          <h2 class="text-xl font-bold text-slate-900">Add Ongoing Work / Maintenance</h2>
        </div>
        <div class="space-y-4">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Work Title *</label>
              <input type="text" id="w-title" placeholder="e.g. CCTV Upgrades" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Status</label>
              <select id="w-status" class="w-full border px-3 py-2 rounded-lg text-sm">
                <option value="Planning">Planning</option>
                <option value="In Progress">In Progress</option>
                <option value="Testing">Testing</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Progress Percentage (0 - 100%) *</label>
              <input type="number" id="w-progress" min="0" max="100" placeholder="75" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-600 mb-1">Target Completion Date</label>
              <input type="date" id="w-date" class="w-full border px-3 py-2 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-600 mb-1">Description</label>
            <input type="text" id="w-desc" placeholder="Details about vendor, scope, etc." class="w-full border px-3 py-2 rounded-lg text-sm">
          </div>
          <button type="button" onclick="saveWorkDirect()" id="w-btn" class="bg-slate-900 hover:bg-slate-800 text-white text-sm font-bold px-6 py-2.5 rounded-lg cursor-pointer transition">
            Save Work Item
          </button>
        </div>
      </div>

    </div>
  </div>

  <!-- NATIVE REST API SCRIPT (Zero Dependencies) -->
  <script>
    const SUPABASE_URL = "https://hhlqktcxnyivdnfnlzag.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhobHFrdGN4bnlpdmRuZm5semFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NjE1MDcsImV4cCI6MjEwMjUzNzUwN30.mMrDEdi1ikcId6P0-FJp6bCRJ0vn8lArI3DIRErIzFI";

    // 1. Direct Native Publish Notice
    async function publishNoticeDirect() {
      const title = document.getElementById('n-title').value.trim();
      const category = document.getElementById('n-category').value;
      const description = document.getElementById('n-desc').value.trim();
      const is_urgent = document.getElementById('n-urgent').checked;
      const btn = document.getElementById('n-btn');

      if (!title || !description) {
        alert("⚠️ Please enter both Title and Message.");
        return;
      }

      btn.innerText = "Connecting & Saving...";
      btn.disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/notices`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation"
          },
          body: JSON.stringify([{ title, category, description, is_urgent }])
        });

        if (response.ok) {
          alert("🎉 SUCCESS! Notice published live to Supabase and Website!");
          document.getElementById('n-title').value = '';
          document.getElementById('n-desc').value = '';
        } else {
          const errData = await response.json();
          alert("Database Error: " + (errData.message || response.statusText));
        }
      } catch (err) {
        alert("Network Error: " + err.message);
      } finally {
        btn.innerText = "Post Notice Live";
        btn.disabled = false;
      }
    }

    // 2. Direct Native Save Resident
    async function saveResidentDirect() {
      const flat_no = document.getElementById('r-flat').value.trim();
      const owner_name = document.getElementById('r-owner').value.trim();
      const occupancy_status = document.getElementById('r-status').value;
      const owner_phone = document.getElementById('r-phone').value.trim();
      const tenant_name = document.getElementById('r-tenant').value.trim() || null;
      const parking_slot = document.getElementById('r-parking').value.trim() || null;
      const btn = document.getElementById('r-btn');

      if (!flat_no || !owner_name) {
        alert("⚠️ Please enter Flat Number and Owner Name.");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/resident_directory`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "resolution=merge-duplicates"
          },
          body: JSON.stringify([{ flat_no, owner_name, occupancy_status, owner_phone, tenant_name, parking_slot }])
        });

        if (response.ok) {
          alert("🎉 SUCCESS! Record for Flat " + flat_no + " saved live!");
          document.getElementById('r-flat').value = '';
          document.getElementById('r-owner').value = '';
        } else {
          const err = await response.json();
          alert("Error: " + (err.message || response.statusText));
        }
      } catch (e) {
        alert("Network Error: " + e.message);
      } finally {
        btn.innerText = "Save Flat Record";
        btn.disabled = false;
      }
    }

    // 3. Direct Native Save Work
    async function saveWorkDirect() {
      const title = document.getElementById('w-title').value.trim();
      const status = document.getElementById('w-status').value;
      const progress_percentage = parseInt(document.getElementById('w-progress').value) || 0;
      const target_date = document.getElementById('w-date').value || null;
      const description = document.getElementById('w-desc').value.trim();
      const btn = document.getElementById('w-btn');

      if (!title) {
        alert("⚠️ Please enter Work Title.");
        return;
      }

      btn.innerText = "Saving...";
      btn.disabled = true;

      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/works_tracker`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify([{ title, status, progress_percentage, target_date, description }])
        });

        if (response.ok) {
          alert("🎉 SUCCESS! Work item saved live!");
          document.getElementById('w-title').value = '';
          document.getElementById('w-desc').value = '';
        } else {
          const err = await response.json();
          alert("Error: " + (err.message || response.statusText));
        }
      } catch (e) {
        alert("Network Error: " + e.message);
      } finally {
        btn.innerText = "Save Work Item";
        btn.disabled = false;
      }
    }

    // 4. Direct Upload Minutes (PDF)
    async function uploadMinutesDirect() {
      const date = document.getElementById('m-date').value;
      const type = document.getElementById('m-type').value;
      const agenda = document.getElementById('m-agenda').value.trim();
      const fileInput = document.getElementById('m-file');
      const btn = document.getElementById('m-btn');

      if (!date || !agenda || !fileInput.files[0]) {
        alert("⚠️ Please enter Date, Agenda summary, and select a PDF file.");
        return;
      }

      const file = fileInput.files[0];
      const fileName = `minutes_${Date.now()}_${file.name.replace(/\s+/g, '_')}`;

      btn.innerText = "Uploading PDF to Vault...";
      btn.disabled = true;

      try {
        // Upload file to Supabase Storage
        const uploadRes = await fetch(`${SUPABASE_URL}/storage/v1/object/society-vault/${fileName}`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": file.type || "application/pdf"
          },
          body: file
        });

        if (!uploadRes.ok) {
          const upErr = await uploadRes.json();
          throw new Error(upErr.message || "Storage upload failed");
        }

        const publicPdfUrl = `${SUPABASE_URL}/storage/v1/object/public/society-vault/${fileName}`;

        // Save row in meeting_minutes table
        const dbRes = await fetch(`${SUPABASE_URL}/rest/v1/meeting_minutes`, {
          method: "POST",
          headers: {
            "apikey": SUPABASE_ANON_KEY,
            "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=minimal"
          },
          body: JSON.stringify([{ meeting_date: date, meeting_type: type, agenda_summary: agenda, pdf_url: publicPdfUrl }])
        });

        if (dbRes.ok) {
          alert("🎉 SUCCESS! Meeting minutes PDF published!");
          document.getElementById('m-agenda').value = '';
          fileInput.value = '';
        } else {
          const dbErr = await dbRes.json();
          alert("Database Error: " + (dbErr.message || dbRes.statusText));
        }
      } catch (e) {
        alert("Error: " + e.message);
      } finally {
        btn.innerText = "Publish Minutes (PDF)";
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
